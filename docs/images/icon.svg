      <stop offset="0" stop-color="#1C2542"/><stop offset="1" stop-color="#0C1122"/>
    </linearGradient>
    <clipPath id="mask"><circle cx="54" cy="54" r="33"/></clipPath>
  </defs>
  <g clip-path="url(#mask)">
    <rect x="21" y="21" width="66" height="66" fill="url(#night)"/>
    <circle cx="54" cy="51" r="16" fill="#E9A15C" opacity="0.30"/>
    <circle cx="54" cy="51" r="13" fill="#E9A15C"/>
    <circle cx="49.5" cy="47" r="4.5" fill="#F2BE85"/>
    <circle cx="77" cy="62" r="8.5" fill="#F0EAD8"/>
    <circle cx="74.5" cy="59.6" r="1.7" fill="#D8CDAE"/>
    <circle cx="78.5" cy="64.9" r="1.3" fill="#D8CDAE"/>
    <path d="M33,30.5 L35.5,33 L33,35.5 L30.5,33 Z" fill="#C7D0E8"/>
