<text x="729.0" y="228" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15" fill="#4f8a5b" text-anchor="middle">Bluetooth · ~10 m</text>
<text x="550" y="366" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">Each side proves it knows the shared</text>
<text x="550" y="389" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">secret before anything is believed, and</text>
<text x="550" y="412" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">a captured message cannot be replayed.</text>
<text x="550" y="435" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a"></text>
<text x="550" y="458" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">Messages are small: rules out, battery</text>
<text x="550" y="481" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">and “what is open right now” back.</text>
<text x="550" y="504" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">No internet is involved at any point.</text>
<path d="M59.12622256515775,555.333549382716 L919.5408762002744,555.7482030178327 Q933.955529835391,556.1628566529492 934.3701834705075,570.5775102880658 L934.7848371056241,646.9921639231825 Q935.1994907407408,661.406817558299 921.6141443758573,661.8214711934156 L62.02879801097394,662.2361248285322 Q48.44345164609054,657.4507784636488 43.658105281207135,643.8654320987654 L44.07275891632373,568.2800857338821 Q44.48741255144033,554.6947393689986 58.90206618655693,555.1093930041152" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="76" y="596" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Out of range? Nothing changes.</text>
<text x="76" y="626" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">Bedtime, the allowed apps, the content rules — the child’s phone holds all of them on its own.</text>
<text x="76" y="648" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">Your phone is a remote control, not a dependency — flat battery, left at work, switched off.</text>
