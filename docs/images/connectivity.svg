<text x="251.0" y="228" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15" fill="#3d7ea6" text-anchor="middle">Wi-Fi</text>
<text x="72" y="366" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">The child’s phone downloads the app</text>
<text x="72" y="389" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">from your own phone — not from a store,</text>
<text x="72" y="412" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">not from a server of ours.</text>
<text x="72" y="435" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a"></text>
<text x="72" y="458" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">Your home Wi-Fi, your phone’s own</text>
<text x="72" y="481" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">hotspot, or a link you host. Then Wi-Fi</text>
<text x="72" y="504" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="15.5" fill="#7c736a">is finished with; it is never needed again.</text>
