<circle cx="104.0" cy="420.0" r="3.4" fill="#3d7ea6"/>
<text x="138" y="404" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="17" font-weight="bold" fill="#2f2b28">Your home Wi-Fi</text>
<text x="138" y="428" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="14.5" fill="#7c736a">both phones join the network</text>
<path d="M366.7,366.9 L615.1,367.3 Q627.5,367.7 627.9,380.1 L628.3,444.5 Q623.5,451.7 611.9,452.1 L364.4,452.6 Q352.8,453.0 353.2,441.4 L353.6,377.8 Q354.0,366.2 366.4,366.6" fill="#ffffff" stroke="#2f2b28" stroke-width="2.2"/>
