<text x="490" y="880" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#4f8a5b" text-anchor="middle">Bluetooth — no cloud, no account, no subscription</text>
