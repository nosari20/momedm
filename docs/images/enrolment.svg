<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 872" width="980" height="872" role="img" aria-label="Setting up a child’s phone, in six steps">
<title>Setting up a child’s phone, in six steps</title>
<rect x="0" y="0" width="980" height="872" rx="18" fill="#fdfaf3"/>
<path d="M34.157484567901236,14.364811385459534 L946.5721382030179,14.779465020576131 Q966.9867918381344,15.19411865569273 967.401445473251,35.60877229080933 L967.8160991083677,840.023425925926 Q968.2307527434842,860.4380795610425 943.4454063786009,855.6527331961591 L31.860060013717423,856.0673868312757 Q12.27471364883402,856.4820404663923 12.689367283950617,836.896694101509 L13.104020919067215,33.311347736625514 Q13.518674554183814,13.726001371742113 33.93332818930041,14.140655006858712" fill="none" stroke="#2f2b28" stroke-width="2" stroke-opacity="0.35"/>
<text x="490.0" y="66" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="30" font-weight="bold" fill="#2f2b28" text-anchor="middle">Setting up a child’s phone</text>
<text x="490.0" y="96" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="17" fill="#7c736a" text-anchor="middle">once, at the kitchen table — about ten minutes</text>
<path d="M108.63887860082305,150.84620541838134 L403.05353223593966,151.26085905349794 Q417.4681858710562,151.67551268861453 417.88283950617284,166.09016632373113 L418.29749314128946,278.50481995884775 Q418.71214677640603,292.9194735939643 405.12680041152265,293.33412722908093 L111.54145404663923,293.74878086419756 Q97.95610768175582,294.1634344993141 98.37076131687243,280.57808813443074 L93.58541495198902,163.79274176954732 Q94.00006858710563,150.2073954046639 108.41472222222222,150.62204903978053" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="116" y="192" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Wipe it</text>
<text x="116" y="224" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">Factory reset the child’s phone.</text>
<text x="116" y="248" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">Android hands over control only</text>
<text x="116" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">during first-time setup.</text>
<circle cx="122" cy="150" r="17" fill="#3d7ea6" stroke="#2f2b28" stroke-width="2.4"/>
<text x="122" y="157" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<path d="M577.3341272290809,153.54145404663925 L871.7487808641976,153.95610768175584 Q886.1634344993141,154.37076131687243 886.5780881344307,163.58541495198904 L881.7927417695473,276.0000685871056 Q882.2073954046639,290.4147222222222 868.6220490397806,290.82937585733885 L575.0367026748971,291.2440294924554 Q561.4513563100137,291.65868312757203 561.8660099451304,278.0733367626886 L562.2806635802469,166.48799039780522 Q562.6953172153635,152.9026440329218 577.1099708504801,153.3172976680384" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="582" y="192" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Pick the network</text>
<text x="582" y="224" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">On your phone, tap “+” and choose</text>
<text x="582" y="248" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">your Wi-Fi, your phone’s own hotspot,</text>
<text x="582" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">or a plain download link.</text>
<circle cx="588" cy="150" r="17" fill="#3d7ea6" stroke="#2f2b28" stroke-width="2.4"/>
<text x="588" y="157" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<path d="M108.82937585733882,335.0367026748971 L403.2440294924554,335.4513563100137 Q417.65868312757203,335.8660099451303 418.0733367626886,350.28066358024694 L418.4879903978052,462.6953172153635 Q418.9026440329218,477.1099708504801 405.3172976680384,477.5246244855967 L111.731951303155,477.9392781207133 Q98.14660493827161,478.3539317558299 98.5612585733882,459.5685853909465 L93.7759122085048,347.9832390260631 Q94.1905658436214,334.3978926611797 108.605219478738,334.8125462962963" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="116" y="376" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Show the code</text>
<text x="116" y="408" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">Your phone draws a QR code.</text>
<text x="116" y="432" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">It carries the pairing secret —</text>
<text x="116" y="456" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">don’t photograph it.</text>
<circle cx="122" cy="334" r="17" fill="#3d7ea6" stroke="#2f2b28" stroke-width="2.4"/>
<text x="122" y="341" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<path d="M577.5246244855967,337.73195130315503 L871.9392781207133,338.1466049382716 Q886.3539317558299,338.5612585733882 881.5685853909465,347.7759122085048 L881.9832390260631,460.1905658436214 Q882.3978926611798,474.605219478738 868.8125462962963,475.0198731138546 L575.2271999314129,475.43452674897117 Q561.6418535665294,475.8491803840878 562.0565072016461,462.2638340192044 L562.4711608367627,350.678487654321 Q562.8858144718793,337.0931412894376 577.3004681069959,337.50779492455416" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="582" y="376" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Tap six times</text>
<text x="582" y="408" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">On the wiped phone, tap the first</text>
<text x="582" y="432" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">welcome screen six times.</text>
<text x="582" y="456" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">A scanner opens.</text>
<circle cx="588" cy="334" r="17" fill="#4f8a5b" stroke="#2f2b28" stroke-width="2.4"/>
<text x="588" y="341" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<path d="M109.0198731138546,519.2271999314129 L403.43452674897117,519.6418535665294 Q417.8491803840878,520.0565072016461 418.2638340192044,534.4711608367627 L418.678487654321,646.8858144718793 Q419.0931412894376,661.3004681069959 405.50779492455416,661.7151217421125 L111.92244855967078,662.1297753772291 Q98.33710219478738,662.5444290123456 93.55175582990398,643.7590826474623 L93.96640946502058,532.1737362825788 Q94.38106310013717,518.5883899176955 108.79571673525378,519.0030435528121" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="116" y="560" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Scan it</text>
<text x="116" y="592" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">The child’s phone downloads the app</text>
<text x="116" y="616" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">from your phone and installs itself</text>
<text x="116" y="640" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">as the device owner.</text>
<circle cx="122" cy="518" r="17" fill="#4f8a5b" stroke="#2f2b28" stroke-width="2.4"/>
<text x="122" y="525" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<path d="M577.7151217421125,521.9224485596708 L872.1297753772291,522.3371021947873 Q886.5444290123456,517.551755829904 881.7590826474623,531.9664094650205 L882.1737362825788,644.3810631001372 Q882.5883899176955,658.7957167352538 869.0030435528121,659.2103703703704 L575.4176971879286,659.6250240054869 Q561.8323508230453,660.0396776406036 562.2470044581619,646.4543312757202 L562.6616580932784,534.8689849108367 Q563.076311728395,521.2836385459534 577.4909653635117,521.69829218107" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="582" y="560" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">That’s it</text>
<text x="582" y="592" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">The two phones find each other and</text>
<text x="582" y="616" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">pair. From here the rules hold, with</text>
<text x="582" y="640" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">or without you nearby.</text>
<circle cx="588" cy="518" r="17" fill="#4f8a5b" stroke="#2f2b28" stroke-width="2.4"/>
<text x="588" y="525" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
