<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1052" width="980" height="1052" role="img" aria-label="Setting up a child’s phone in six steps, including the three ways of getting it onto a network">
<title>Setting up a child’s phone, in six steps</title>
<rect x="0" y="0" width="980" height="1052" rx="18" fill="#fdfaf3"/>
<path d="M34.2,14.4 L946.6,14.8 Q967.0,15.2 967.4,35.6 L967.8,1020.0 Q968.2,1040.4 943.4,1035.7 L31.9,1036.1 Q12.3,1036.5 12.7,1016.9 L13.1,33.3 Q13.5,13.7 33.9,14.1" fill="none" stroke="#2f2b28" stroke-width="2" stroke-opacity="0.35"/>
<text x="490" y="66" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="30" font-weight="bold" fill="#2f2b28" text-anchor="middle">Setting up a child’s phone</text>
<text x="490" y="96" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="17" fill="#7c736a" text-anchor="middle">once, at the kitchen table — about ten minutes</text>
<path d="M108.6,150.8 L403.1,151.3 Q417.5,151.7 417.9,166.1 L418.3,278.5 Q418.7,292.9 405.1,293.3 L111.5,293.7 Q98.0,294.2 98.4,280.6 L93.6,163.8 Q94.0,150.2 108.4,150.6" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="116" y="192" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Wipe it</text>
<text x="116" y="224" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">Factory reset the child’s phone.</text>
<text x="116" y="248" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">Android hands over control only</text>
<text x="116" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">during first-time setup.</text>
<circle cx="122" cy="150" r="17" fill="#3d7ea6" stroke="#2f2b28" stroke-width="2.4"/>
<text x="122" y="157" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<path d="M577.3,153.5 L871.7,154.0 Q886.2,154.4 886.6,163.6 L881.8,276.0 Q882.2,290.4 868.6,290.8 L575.0,291.2 Q561.5,291.7 561.9,278.1 L562.3,166.5 Q562.7,152.9 577.1,153.3" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="582" y="192" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Pick the network</text>
<text x="582" y="224" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">The child’s phone needs to reach</text>
<text x="582" y="248" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">yours, just long enough to fetch</text>
<text x="582" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">the app. Three ways to do it:</text>
<circle cx="588" cy="150" r="17" fill="#3d7ea6" stroke="#2f2b28" stroke-width="2.4"/>
<text x="588" y="157" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<path d="M108.8,495.0 L403.2,495.5 Q417.7,495.9 418.1,510.3 L418.5,622.7 Q418.9,637.1 405.3,637.5 L111.7,637.9 Q98.1,638.4 98.6,619.6 L93.8,508.0 Q94.2,494.4 108.6,494.8" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="116" y="536" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Show the code</text>
<text x="116" y="568" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">Your phone draws a QR code.</text>
<text x="116" y="592" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">It carries the pairing secret —</text>
<text x="116" y="616" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">don’t photograph it.</text>
<circle cx="122" cy="494" r="17" fill="#3d7ea6" stroke="#2f2b28" stroke-width="2.4"/>
<text x="122" y="501" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<path d="M577.5,497.7 L871.9,498.1 Q886.4,498.6 881.6,507.8 L882.0,620.2 Q882.4,634.6 868.8,635.0 L575.2,635.4 Q561.6,635.8 562.1,622.3 L562.5,510.7 Q562.9,497.1 577.3,497.5" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="582" y="536" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Tap six times</text>
<text x="582" y="568" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">On the wiped phone, tap the first</text>
<text x="582" y="592" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">welcome screen six times.</text>
<text x="582" y="616" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">A scanner opens.</text>
<circle cx="588" cy="494" r="17" fill="#4f8a5b" stroke="#2f2b28" stroke-width="2.4"/>
<text x="588" y="501" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<path d="M109.0,691.2 L403.4,691.6 Q417.8,692.1 418.3,706.5 L418.7,818.9 Q419.1,833.3 405.5,833.7 L111.9,834.1 Q98.3,834.5 93.6,815.8 L94.0,704.2 Q94.4,690.6 108.8,691.0" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="116" y="732" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">Scan it</text>
<text x="116" y="764" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">The child’s phone downloads the app</text>
<text x="116" y="788" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">from your phone and installs itself</text>
<text x="116" y="812" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">as the device owner.</text>
<circle cx="122" cy="690" r="17" fill="#4f8a5b" stroke="#2f2b28" stroke-width="2.4"/>
<text x="122" y="697" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<path d="M577.7,693.9 L872.1,694.3 Q886.5,689.6 881.8,704.0 L882.2,816.4 Q882.6,830.8 869.0,831.2 L575.4,831.6 Q561.8,832.0 562.2,818.5 L562.7,706.9 Q563.1,693.3 577.5,693.7" fill="#ffffff" stroke="#2f2b28" stroke-width="2.6"/>
<text x="582" y="732" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="20" font-weight="bold" fill="#2f2b28">That’s it</text>
<text x="582" y="764" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">The two phones find each other and</text>
<text x="582" y="788" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">pair. From here the rules hold, with</text>
<text x="582" y="812" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="16" fill="#7c736a">or without you nearby.</text>
<circle cx="588" cy="690" r="17" fill="#4f8a5b" stroke="#2f2b28" stroke-width="2.4"/>
<text x="588" y="697" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<path d="M60.6,320.9 L917.1,321.3 Q933.5,321.7 933.9,338.1 L934.3,452.5 Q934.7,468.9 919.1,469.3 L63.5,469.8 Q48.0,470.2 48.4,454.6 L43.6,335.8 Q44.0,320.2 60.4,320.6" fill="#3d7ea6" fill-opacity="0.06" stroke="#3d7ea6" stroke-width="2" stroke-dasharray="9 7"/>
<text x="66" y="352" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="17" font-weight="bold" fill="#3d7ea6">Any of the three does the same job — pick whichever suits your house</text>
<path d="M76.4,364.6 L324.8,365.0 Q337.2,365.4 337.6,377.8 L338.0,442.2 Q338.4,454.7 326.9,455.1 L79.3,455.5 Q67.7,455.9 68.1,444.3 L68.5,375.5 Q63.7,363.9 76.1,364.4" fill="#ffffff" stroke="#2f2b28" stroke-width="2.2"/>
