<path d="M408.8,392.8 Q424.0,408.0 408.8,423.2" fill="none" stroke="#3d7ea6" stroke-width="2.6" stroke-linecap="round" opacity="0.78"/>
<text x="426" y="404" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="17" font-weight="bold" fill="#2f2b28">Your phone’s hotspot</text>
<text x="426" y="428" font-family="Comic Sans MS, Comic Neue, Segoe Print, Bradley Hand, Chalkboard SE, cursive" font-size="14.5" fill="#7c736a">no network needed at all</text>
<path d="M651.7,363.9 L900.1,364.4 Q912.6,364.8 913.0,377.2 L913.4,441.6 Q913.8,454.0 902.2,454.4 L654.6,454.8 Q643.0,455.3 643.5,443.7 L643.9,380.1 Q644.3,368.5 651.5,363.7" fill="#ffffff" stroke="#2f2b28" stroke-width="2.2"/>
